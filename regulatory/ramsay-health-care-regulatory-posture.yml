    section: '2.7 Access to and correction of your personal information'
    channel: Ramsay Privacy Officer (section 3.1 Corporate Privacy Officer)
    rights_named: [access, correction]
    escalation: Office of the Australian Information Commissioner (www.oaic.gov.au)
    evidence:
    - source: https://www.ramsayhealth.com/en/privacy-policy/
      http_status: 200
